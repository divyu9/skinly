<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GoSkinly</title>
    <meta name="author" content="GoSkinly" />
    <!-- Per-page title/description/canonical/OG/JSON-LD are written here by
         scripts/prerender.mjs at build time. Nothing page-specific belongs in
         this template: it is also the shell for routes that are not
         prerendered, and a hardcoded canonical here told every page on the
         site that it was a copy of the homepage. -->
    <!--seo-head-->
    <!-- A page whose own bundle is gone reloads itself, once.
         Every page is cached at the edge for a few minutes, and every deploy
         replaces the hashed bundles under /assets with new names. For those
         minutes the edge can hand out yesterday's HTML pointing at files that
         now answer 404 — a blank, unstyled page. When one of our own assets
         fails, this asks again with a query string the edge has never seen,
         which fetches the current HTML. A session flag stops it looping if
         the fresh copy fails too; lazily loaded chunks already heal the same
         way through lazyWithReload. -->
    <script>
      (function () {
        var KEY = "__assetReload";
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (!t || t === window) return;
          var src = t.src || t.href || "";
          if (src.indexOf(location.origin + "/assets/") !== 0) return;
          try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, "1"); } catch (_) { return; }
          var u = new URL(location.href);
          u.searchParams.set("_v", String(Date.now()));
          location.replace(u.toString());
        }, true);
        window.addEventListener("load", function () {
          try { sessionStorage.removeItem(KEY); } catch (_) {}
          // Leave nobody holding a URL with the cache-buster in it.
          if (location.search.indexOf("_v=") !== -1) {
            var u = new URL(location.href);
            u.searchParams.delete("_v");
            history.replaceState(history.state, "", u.pathname + (u.search === "?" ? "" : u.search) + u.hash);
          }
        });
      })();
    </script>
    <!-- Google's favicon crawler fetches a URL; it cannot read a data: URI,
         which is what stood here, and /favicon.ico answered 404. Both are why
         the tab and the search result showed a blank page icon. The mark is
         the logo's own "s", which is the only part of a wordmark that stays
         legible at sixteen pixels. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2abc9d" />

    <!-- Facebook Domain Verification -->
    <meta name="facebook-domain-verification" content="vm0bjui4j2eqmsl9csnumdym9zepkk" />

    <!-- Resource Hints for Performance -->
    <link rel="preconnect" href="https://pub-db30b224c5eb4a378f7b3fd8fd5f2272.r2.dev" crossorigin />
    <!-- The two families the site actually sets text in, fetched without
         holding up the first paint: text shows in the system font at once and
         swaps to Geist when it arrives. Connections open early because the
         stylesheet and the font files come from two different hosts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" /></noscript>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />


    <!-- No PhonePe checkout.js: payment goes by redirect to PhonePe's own page
         and nothing calls window.PhonePeCheckout, so every visitor downloaded
         a script from a fourth host for nothing. -->

    <!-- Google Analytics - Aggressively deferred (5s or user interaction) -->
    <script>
      (function() {
        var loaded = false;
        var loadAnalytics = function() {
          if (loaded) return;
          loaded = true;
          
          var script = document.createElement('script');
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-16S5XDYGYR';
          script.async = true;
          document.head.appendChild(script);
          
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-16S5XDYGYR');
        };
        
        // Load after 5 seconds
        setTimeout(loadAnalytics, 5000);
        
        // OR load on first user interaction
        var events = ['scroll', 'click', 'touchstart', 'mousemove', 'keydown'];
        events.forEach(function(event) {
          window.addEventListener(event, function() {
            loadAnalytics();
            events.forEach(function(e) {
              window.removeEventListener(e, loadAnalytics);
            });
          }, { once: true, passive: true });
        });
      })();
    </script>

    <!-- Meta Pixel - Initialized dynamically from Convex settings -->
    <script>
      window.__fbPixelId = null;
      window.__fbPixelLoaded = false;
      
      window.initFacebookPixel = function(pixelId) {
        if (!pixelId || window.__fbPixelLoaded) return;
        window.__fbPixelId = pixelId;
        
        var loadPixel = function() {
          if (window.__fbPixelLoaded) return;
          window.__fbPixelLoaded = true;
          
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', window.__fbPixelId);
          fbq('track', 'PageView');
        };
        
        // Load after 5 seconds
        setTimeout(loadPixel, 5000);
        
        // OR load on first user interaction
        var events = ['scroll', 'click', 'touchstart', 'mousemove', 'keydown'];
        events.forEach(function(event) {
          window.addEventListener(event, function() {
            loadPixel();
            events.forEach(function(e) {
              window.removeEventListener(e, loadPixel);
            });
          }, { once: true, passive: true });
        });
      };
    </script>


    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      (function () {
        try {
          // No stored choice means light: that is the ThemeProvider's
          // defaultTheme. Reading it as "system" painted dark-mode phones
          // black until the app booted and switched them back to white.
          var theme = localStorage.getItem("theme") || "light";
          if (theme === "system") {
            var prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;
            theme = prefersDark ? "dark" : "light";
          }
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
    
    <!-- Critical CSS - Inlined for above-the-fold content -->
    <style>
      /* Cascade layers: unlayered rules outrank every @layer, so this block
         must sit in `base` or its reset would beat Tailwind's utilities and
         strip the border off every element in the app. */
      @layer base {
      /* Critical layout and base styles */
      *,::before,::after{box-sizing:border-box;border:0 solid}html{-webkit-text-size-adjust:100%;tab-size:4;font-family:ui-sans-serif,system-ui,sans-serif}body{margin:0;line-height:inherit}
      
      /* Color variables for critical rendering */
      :root{--radius:0.75rem;--background:oklch(1 0 0);--foreground:oklch(0.09 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.09 0 0);--primary:oklch(0.09 0 0);--primary-foreground:oklch(0.98 0 0);--muted:oklch(0.96 0 0);--border:oklch(0.90 0 0)}
      .dark{--background:oklch(0.09 0 0);--foreground:oklch(0.98 0 0);--card:oklch(0.14 0 0);--card-foreground:oklch(0.98 0 0);--primary:oklch(0.98 0 0);--primary-foreground:oklch(0.09 0 0);--muted:oklch(0.20 0 0);--border:oklch(0.27 0 0)}
      
      body{background:var(--background);color:var(--foreground);font-family:ui-sans-serif,system-ui,sans-serif}
      
      /* Critical header styles */
      .fixed{position:fixed}.top-0{top:0}.left-0{left:0}.right-0{right:0}.z-50{z-index:50}
      .flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
      .h-16{height:4rem}.px-4{padding-left:1rem;padding-right:1rem}
      .bg-background{background-color:var(--background)}.border-b{border-bottom-width:1px}
      .border-border{border-color:var(--border)}
      
      /* No content-visibility on images. `img{content-visibility:auto;
         contain-intrinsic-size:1200px}` stood here: every image off screen
         was laid out as a 1200px box until it rendered and then shrank to its
         real size, which is a layout shift for everything below it. */
      
      /* Hide content during load to prevent FOUC */
      #root{min-height:100vh}
      }
    </style>
    
    <!-- Load full CSS and fonts asynchronously -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="/src/index.css" rel="stylesheet" /></noscript>
  </head>
  <body>
    <noscript>
      <div id="fb-pixel-noscript"></div>
    </noscript>
    <!--seo-body-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
